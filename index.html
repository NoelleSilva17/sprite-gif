<script src="https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.umd.js"></script>

<script>

const { GIFEncoder, quantize, applyPalette } = GIFenc;

const upload = document.getElementById("upload");
const colsInput = document.getElementById("cols");
const rowsInput = document.getElementById("rows");
const fpsInput = document.getElementById("fps");
const scaleInput = document.getElementById("scale");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const result = document.getElementById("result");

let image = new Image();
let frames = [];

let interval;
let currentFrame = 0;

upload.addEventListener("change", e => {

    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = ev => {

        image.onload = () => {
            generateFrames();
            startPreview();
        };

        image.src = ev.target.result;
    };

    reader.readAsDataURL(file);
});

function generateFrames() {

    frames = [];

    const cols = parseInt(colsInput.value);
    const rows = parseInt(rowsInput.value);

    const frameWidth = image.width / cols;
    const frameHeight = image.height / rows;

    const scale = parseInt(scaleInput.value);

    canvas.width = frameWidth * scale;
    canvas.height = frameHeight * scale;

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            frames.push({
                x: x * frameWidth,
                y: y * frameHeight,
                width: frameWidth,
                height: frameHeight
            });
        }
    }
}

function drawFrame(frame) {

    const scale = parseInt(scaleInput.value);

    ctx.fillStyle = "#f8faf7";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(
        image,
        frame.x,
        frame.y,
        frame.width,
        frame.height,
        0,
        0,
        frame.width * scale,
        frame.height * scale
    );
}

function startPreview() {

    clearInterval(interval);

    const fps = parseInt(fpsInput.value);

    currentFrame = 0;

    interval = setInterval(() => {

        drawFrame(frames[currentFrame]);

        currentFrame++;

        if (currentFrame >= frames.length) {
            currentFrame = 0;
        }

    }, 1000 / fps);
}

document.getElementById("previewBtn").addEventListener("click", () => {
    generateFrames();
    startPreview();
});

document.getElementById("exportBtn").addEventListener("click", async () => {

    const fps = parseInt(fpsInput.value);
    const scale = parseInt(scaleInput.value);

    const frameWidth = image.width / parseInt(colsInput.value);
    const frameHeight = image.height / parseInt(rowsInput.value);

    const off = document.createElement("canvas");
    const octx = off.getContext("2d");

    off.width = frameWidth * scale;
    off.height = frameHeight * scale;

    const encoder = new GIFEncoder(off.width, off.height);

    encoder.setDelay(1000 / fps);
    encoder.setRepeat(0);
    encoder.start();

    for (let frame of frames) {

        octx.fillStyle = "#f8faf7";
        octx.fillRect(0, 0, off.width, off.height);

        octx.drawImage(
            image,
            frame.x,
            frame.y,
            frame.width,
            frame.height,
            0,
            0,
            frame.width * scale,
            frame.height * scale
        );

        encoder.addFrame(octx);
    }

    const blob = encoder.finish();

    const url = URL.createObjectURL(encoder.out.getData ? new Blob([encoder.out.getData()], { type: "image/gif" }) : new Blob([]));

    result.innerHTML = `
        <h3>GIF listo</h3>
        <img src="${url}">
        <br><br>
        <a download="sprite.gif" href="${url}">
            <button>Descargar GIF</button>
        </a>
    `;

});

</script>
