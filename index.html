<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprite → GIF</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:20px;
}

.panel{
    background:#1e1e1e;
    padding:15px;
    border-radius:10px;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:8px;
}

canvas{
    background:#222;
    image-rendering:pixelated;
}
</style>
</head>
<body>

<h1>Sprite Sheet → GIF</h1>

<div class="container">

<div class="panel">

<input type="file" id="upload">

<label>Columnas</label>
<input type="number" id="cols" value="22">

<label>Filas</label>
<input type="number" id="rows" value="1">

<label>FPS</label>
<input type="number" id="fps" value="10">

<label>Escala</label>
<input type="number" id="scale" value="1">

<button id="exportBtn">Exportar GIF</button>

</div>

<div class="panel">

<canvas id="canvas"></canvas>

<div id="out"></div>

</div>

</div>

<script>

const upload = document.getElementById("upload");
const colsInput = document.getElementById("cols");
const rowsInput = document.getElementById("rows");
const fpsInput = document.getElementById("fps");
const scaleInput = document.getElementById("scale");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const out = document.getElementById("out");

let img = new Image();
let frames = [];

upload.addEventListener("change", e=>{

    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = ev=>{
        img.onload = ()=>{
            buildFrames();
        };
        img.src = ev.target.result;
    };

    reader.readAsDataURL(file);
});

function buildFrames(){

    frames = [];

    const cols = +colsInput.value;
    const rows = +rowsInput.value;

    const fw = img.width / cols;
    const fh = img.height / rows;

    const scale = +scaleInput.value;

    canvas.width = fw * scale;
    canvas.height = fh * scale;

    for(let y=0;y<rows;y++){
        for(let x=0;x<cols;x++){
            frames.push({x:x*fw,y:y*fh,w:fw,h:fh});
        }
    }

    draw(0);
}

function draw(i){

    const f = frames[i];

    if(!f) return;

    ctx.fillStyle = "#f8faf7";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(img,f.x,f.y,f.w,f.h,0,0,canvas.width,canvas.height);
}

document.getElementById("exportBtn").onclick = ()=>{

    if(!frames.length) return alert("Sube un sprite primero");

    const gif = new GIF({
        workers:2,
        quality:10,
        width:canvas.width,
        height:canvas.height
    });

    const fps = +fpsInput.value;
    const delay = 1000 / fps;

    frames.forEach((f,i)=>{

        draw(i);

        gif.addFrame(ctx,{copy:true,delay});

    });

    out.innerHTML = "Generando GIF...";

    gif.on("finished", blob=>{

        const url = URL.createObjectURL(blob);

        out.innerHTML = `
            <img src="${url}" style="max-width:100%">
            <br><br>
            <a download="sprite.gif" href="${url}">
                Descargar GIF
            </a>
        `;
    });

    gif.render();
};

</script>

</body>
</html>
