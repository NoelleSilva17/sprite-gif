<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO Sprite → GIF Batch</title>

<script src="https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.umd.js"></script>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:20px;
}

.panel{
    background:#1e1e1e;
    padding:15px;
    border-radius:10px;
}

label{
    display:block;
    margin-top:10px;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border:none;
    border-radius:8px;
}

input{
    background:#2a2a2a;
    color:white;
}

button{
    background:#4CAF50;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

canvas{
    background:#222;
    image-rendering:pixelated;
    border-radius:10px;
    max-width:100%;
}

img{
    max-width:100%;
}
</style>
</head>
<body>

<h1>PRO Sprite Sheet → GIF Batch</h1>

<div class="container">

<div class="panel">

<label>Sprites (MULTI)</label>
<input type="file" id="upload" multiple accept="image/*">

<label>Columnas</label>
<input type="number" id="cols" value="22">

<label>Filas</label>
<input type="number" id="rows" value="1">

<label>FPS</label>
<input type="number" id="fps" value="10">

<label>Escala</label>
<input type="number" id="scale" value="1">

<label>Color fondo</label>
<input type="color" id="bg" value="#f8faf7">

<button id="export">EXPORTAR GIFS</button>

</div>

<div class="panel">

<canvas id="canvas"></canvas>

<div id="out"></div>

</div>

</div>

<script>

const { GIFEncoder } = window.gifenc;

const upload = document.getElementById("upload");
const cols = document.getElementById("cols");
const rows = document.getElementById("rows");
const fps = document.getElementById("fps");
const scale = document.getElementById("scale");
const bg = document.getElementById("bg");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const out = document.getElementById("out");

let images = [];

upload.addEventListener("change", e=>{

    images = [];

    const files = [...e.target.files];

    files.forEach(file=>{

        const reader = new FileReader();

        reader.onload = ev=>{

            const img = new Image();
            img.onload = ()=> images.push(img);
            img.src = ev.target.result;

        };

        reader.readAsDataURL(file);

    });

});

function getFrames(img){

    const c = +cols.value;
    const r = +rows.value;

    const fw = img.width / c;
    const fh = img.height / r;

    const s = +scale.value;

    canvas.width = fw * s;
    canvas.height = fh * s;

    const frames = [];

    for(let y=0;y<r;y++){
        for(let x=0;x<c;x++){
            frames.push({x:x*fw,y:y*fh,w:fw,h:fh});
        }
    }

    return frames;
}

function draw(img, frame){

    ctx.fillStyle = bg.value;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(
        img,
        frame.x,frame.y,frame.w,frame.h,
        0,0,canvas.width,canvas.height
    );
}

document.getElementById("export").onclick = async ()=>{

    if(!images.length) return alert("Sube sprites");

    out.innerHTML = "Generando GIFs...";

    const encoders = [];

    for(let img of images){

        const frames = getFrames(img);

        const encoder = new GIFEncoder(canvas.width, canvas.height);
        encoder.setDelay(1000 / +fps.value);
        encoder.setRepeat(0);
        encoder.start();

        for(let f of frames){

            draw(img,f);
            encoder.addFrame(ctx);

        }

        encoder.finish();

        const blob = new Blob([encoder.out], {type:"image/gif"});
        const url = URL.createObjectURL(blob);

        encoders.push(url);
    }

    out.innerHTML = encoders.map((u,i)=>`
        <h3>GIF ${i+1}</h3>
        <img src="${u}">
        <br>
        <a download="sprite_${i}.gif" href="${u}">
            Descargar
        </a>
        <hr>
    `).join("");

};

</script>

</body>
</html>
