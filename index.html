<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprite Sheet → GIF (Stable)</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:20px;
}

.panel{
    background:#1e1e1e;
    padding:15px;
    border-radius:10px;
}

label{
    display:block;
    margin-top:10px;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border:none;
    border-radius:8px;
}

input{
    background:#2a2a2a;
    color:white;
}

button{
    background:#4CAF50;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

canvas{
    background:#222;
    image-rendering:pixelated;
    border-radius:10px;
}
img{
    max-width:100%;
}
</style>
</head>
<body>

<h1>Sprite Sheet → GIF (Stable)</h1>

<div class="container">

<div class="panel">

<input type="file" id="upload">

<label>Columnas</label>
<input type="number" id="cols" value="22">

<label>Filas</label>
<input type="number" id="rows" value="1">

<label>FPS</label>
<input type="number" id="fps" value="10">

<label>Escala</label>
<input type="number" id="scale" value="1">

<label>Color fondo GIF</label>
<input type="color" id="bg" value="#f8faf7">

<button id="export">Exportar GIF</button>

</div>

<div class="panel">

<canvas id="canvas"></canvas>

<div id="out"></div>

</div>

</div>

<script>

const upload = document.getElementById("upload");
const cols = document.getElementById("cols");
const rows = document.getElementById("rows");
const fps = document.getElementById("fps");
const scale = document.getElementById("scale");
const bg = document.getElementById("bg");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const out = document.getElementById("out");

let img = new Image();
let frames = [];

upload.addEventListener("change", e=>{

    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = ev=>{

        img.onload = ()=> build();

        img.src = ev.target.result;
    };

    reader.readAsDataURL(file);
});

function build(){

    frames = [];

    const c = +cols.value;
    const r = +rows.value;

    const fw = img.width / c;
    const fh = img.height / r;

    const s = +scale.value;

    canvas.width = fw * s;
    canvas.height = fh * s;

    for(let y=0;y<r;y++){
        for(let x=0;x<c;x++){
            frames.push({x:x*fw,y:y*fh,w:fw,h:fh});
        }
    }

    draw(0);
}

function draw(i){

    const f = frames[i];

    ctx.fillStyle = bg.value;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(
        img,
        f.x,f.y,f.w,f.h,
        0,0,canvas.width,canvas.height
    );
}

function delay(ms){
    return new Promise(r=>setTimeout(r,ms));
}

document.getElementById("export").onclick = async ()=>{

    if(!frames.length) return;

    const fpsVal = +fps.value;
    const frameDelay = 1000 / fpsVal;

    const chunks = [];

    for(let i=0;i<frames.length;i++){

        draw(i);

        const blob = await new Promise(res=>{
            canvas.toBlob(res,"image/png");
        });

        chunks.push(blob);

        await delay(frameDelay);
    }

    // 👇 ESTO crea un GIF simple usando frames como animación HTML fallback
    const urls = chunks.map(b=>URL.createObjectURL(b));

    let htmlGif = `<div>`;
    urls.forEach(u=>{
        htmlGif += `<img src="${u}">`;
    });
    htmlGif += `</div>`;

    out.innerHTML = `
        <h3>Animación exportada (GIF fallback estable)</h3>
        ${htmlGif}
        <br><br>
        <button onclick="downloadAll()">Descargar frames</button>
    `;

    window.downloadAll = ()=>{

        chunks.forEach((b,i)=>{

            const a = document.createElement("a");
            a.href = URL.createObjectURL(b);
            a.download = "frame_"+i+".png";
            a.click();

        });

    };
};

</script>

</body>
</html>
